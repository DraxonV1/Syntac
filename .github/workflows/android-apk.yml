name: Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SYNTAC_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.SYNTAC_GOOGLE_OAUTH_CLIENT_ID }}
      SYNTAC_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.SYNTAC_GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name repository secret is required for release APK signing"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SYNTAC_GOOGLE_OAUTH_CLIENT_ID="${SYNTAC_GOOGLE_OAUTH_CLIENT_ID}"
          --dart-define=SYNTAC_GOOGLE_OAUTH_CLIENT_SECRET="${SYNTAC_GOOGLE_OAUTH_CLIENT_SECRET}"

      - name: Prepare release asset name
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/syntac-arm64.apk

      - name: Update release manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          apk = Path("build/app/outputs/flutter-apk/syntac-arm64.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          size = apk.stat().st_size

          for path in Path("update").glob("*.json"):
              data = json.loads(path.read_text())
              data["sha256"] = digest
              data["size"] = size
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          match = re.search(r'^version:\s*([^\s]+)', Path('pubspec.yaml').read_text(), re.MULTILINE)
          if not match:
              raise SystemExit('pubspec.yaml version not found')
          print(match.group(1).split('+', 1)[0])
          PY
          )"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          if [[ "$tag" == *beta* || "$tag" == *nightly* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Update release tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.release_meta.outputs.tag }}" "$GITHUB_SHA" -m "Syntac ${{ steps.release_meta.outputs.tag }}"
          git push --force origin "refs/tags/${{ steps.release_meta.outputs.tag }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syntac-arm64-apk
          path: build/app/outputs/flutter-apk/syntac-arm64.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          name: Syntac ${{ steps.release_meta.outputs.tag }}
          body: |
            Android Early Access APK.

            Built from trusted repository workflow after merge or release tag.
          files: |
            build/app/outputs/flutter-apk/syntac-arm64.apk
            update/beta.json
            update/stable.json
            update/nightly.json
